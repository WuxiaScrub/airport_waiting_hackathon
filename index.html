<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0710" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="Forever Mine: Gem Rush — a mobile mining roguelite. Dig deep, carry your gems out, wake the volcano." />
<title>Forever Mine: Gem Rush</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0710'/%3E%3Cpath d='M16 6l7 8-7 12-7-12z' fill='%234fd6e8'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ============ HUD ============ -->
  <!-- A soft dark band behind the top bar, so the readouts hold up over lava. -->
  <div id="hudScrim"></div>
  <div id="hud">
    <div class="hud-left">
      <div id="hearts" class="hearts"></div>
      <div id="helmet" class="helmet hidden"></div>
      <div id="depth" class="depth" data-i18n="hud.surface">SURFACE</div>
      <!-- Eruption clock. Hidden until a run starts, and again once the
           mountain is awake — from then on the depth line carries the lava. -->
      <div id="timer" class="timer hidden"></div>
    </div>
    <div class="hud-right">
      <!-- CARRYING is the at-risk number, so it leads and is the larger one;
           SCORE is what earlier mines already secured. -->
      <div class="wallets">
        <div class="wallet w-carry">
          <svg class="gem" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1l4.5 4L6 11 1.5 5z" fill="currentColor"/></svg>
          <span class="lbl" data-i18n="hud.carrying">CARRYING</span>
          <span id="unbanked" class="val v-carry">0</span>
        </div>
        <div class="wallet w-score">
          <svg class="gem" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1l4.5 4L6 11 1.5 5z" fill="currentColor"/></svg>
          <span class="lbl" data-i18n="hud.score">SCORE</span>
          <span id="score" class="val v-score">0</span>
        </div>
      </div>
      <!-- The only way into the pause menu on a phone without a Back key. -->
      <button id="pauseBtn" class="pause-btn hidden" data-i18n-aria="aria.pause" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="banner" class="banner"></div>
  <div id="achieve" class="achieve" aria-live="polite"></div>
  <div id="hint" class="hint" aria-live="polite"></div>
  <div id="coach" class="coach" aria-live="polite"></div>
  <div id="hurt" class="hurt"></div>

  <!-- ============ TOUCH CONTROLS ============ -->
  <div id="controls">
    <!-- The stick is always on screen so the current heading is readable at a
         glance: the knob shows the push, the arrow shows the tile being aimed
         at (8-way, diagonals included). Touching anywhere in the zone steers it,
         but it stays drawn in place so the thumb never covers it. -->
    <div id="stickzone">
      <div id="stickbase">
        <div id="stickaim"><i></i></div>
        <div id="stickring"></div>
        <div id="stickknob"></div>
      </div>
    </div>
    <!-- Three direct verbs. No tool to select first: the button you press is
         the thing that happens. -->
    <div id="buttons">
      <button id="dynamite" class="act small" data-i18n-aria="aria.dynamite" aria-label="Dynamite">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6.5" y="9" width="11" height="12.5" rx="2.2" fill="#c94b3c"/>
          <rect x="6.5" y="12.5" width="11" height="2.6" fill="#f0e2c2"/>
          <path d="M12 9V6.4c0-2 2.2-2.1 3.2-3.4" stroke="#e0c88a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <circle cx="16" cy="2.6" r="1.9" fill="#ffcf5c"/>
        </svg>
        <span data-i18n="hud.dynamite">DYNAMITE</span>
        <span id="dynCount" class="count">0</span>
      </button>
      <button id="jump" class="act small" data-i18n-aria="aria.jump" aria-label="Jump">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5 L18 11 H14.5 V20 H9.5 V11 H6 Z" fill="currentColor"/>
        </svg>
        <span data-i18n="hud.jump">JUMP</span>
      </button>
      <button id="action" class="act" data-i18n-aria="aria.mine" aria-label="Mine">
        <span data-i18n="hud.mine">MINE</span>
      </button>
    </div>
  </div>

  <!-- ============ MODAL PANEL ============ -->
  <div id="panel" class="panel hidden"><div id="panelInner" class="panel-inner"></div></div>
</div>

<noscript><p style="color:#fff;font:16px system-ui;padding:24px">Forever Mine needs JavaScript enabled. / 矿世奇财需要启用 JavaScript。</p></noscript>

<script src="src/config.js"></script>
<script src="src/i18n.js"></script>
<script src="src/util.js"></script>
<script src="vendor/capacitor-core-8.5.2.js"></script>
<script src="vendor/supabase-2.117.2.js"></script>
<script src="src/native.js"></script>
<script src="src/ads.js"></script>
<script src="src/account.js"></script>
<script src="src/online.js"></script>
<script src="src/highscore.js"></script>
<script src="src/stats.js"></script>
<script src="src/guard.js"></script>
<script src="src/audio.js"></script>
<script src="src/world.js"></script>
<script src="src/particles.js"></script>
<script src="src/entities.js"></script>
<script src="src/enemies.js"></script>
<script src="src/player.js"></script>
<script src="src/input.js"></script>
<script src="src/demo.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>
<script src="src/main.js"></script>
</body>
</html>
